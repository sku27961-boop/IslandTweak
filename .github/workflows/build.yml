name: Build Tweak

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl perl make fakeroot rsync unzip build-essential xz-utils libtinfo5 libxml2 libedit2
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install Linux toolchain (clang for iOS cross-compiling)
        run: |
            packages/*.deb
            islandtweak/packages/*.deb
            islandtweakprefs/packages/*.deb
          if-no-files-found: warn
