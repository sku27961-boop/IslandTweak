name: Build Tweak

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl perl make fakeroot rsync unzip build-essential xz-utils
          sudo apt-get install -y libtinfo5 libxml2 libedit2 || sudo apt-get install -y libtinfo6 libxml2 libedit2
          link_old_soname() {
            OLD_NAME="$1"
            BASE_NAME="$2"
            EXISTING=$(find /usr/lib /lib -name "${BASE_NAME}.*" 2>/dev/null | sort -V | tail -n1)
            if [ -n "$EXISTING" ] && [ ! -e "$(dirname $EXISTING)/$OLD_NAME" ]; then
              sudo ln -s "$EXISTING" "$(dirname $EXISTING)/$OLD_NAME"
              echo "Linked $OLD_NAME -> $EXISTING"
            fi
          }
          link_old_soname libtinfo.so.5 libtinfo.so
          link_old_soname libxml2.so.2 libxml2.so
          link_old_soname libedit.so.2 libedit.so
          sudo ldconfig
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install Linux toolchain (clang for iOS cross-compiling)
        run: |
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma
          TMP=$(mktemp -d)
          tar --lzma -xvf linux-ios-arm64e-clang-toolchain.tar.lzma -C $TMP
          mkdir -p $HOME/theos/toolchain/linux/iphone
          mv $TMP/ios-arm64e-clang-toolchain/* $HOME/theos/toolchain/linux/iphone/
          rm -rf linux-ios-arm64e-clang-toolchain.tar.lzma $TMP

      - name: Install iOS SDK
        run: |
          git clone https://github.com/theos/sdks.git $HOME/sdks-src --depth 1
          cp -r $HOME/sdks-src/iPhoneOS15.6.sdk $HOME/theos/sdks/

      - name: Build package
        env:
          THEOS: /home/runner/theos
        run: |
          export PATH=$THEOS/bin:$PATH
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: IslandTweak-deb
          path: |
            packages/*.deb
            islandtweak/packages/*.deb
            islandtweakprefs/packages/*.deb
          if-no-files-found: warn
